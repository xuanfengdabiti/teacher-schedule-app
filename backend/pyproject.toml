[project]
name = "teacher-schedule-backend"
version = "0.1.0"
description = "教师课程表 App 后端服务"
requires-python = ">=3.12"
dependencies = [
    "dj-rest-auth>=7.2.0",
    "django>=5.2,<5.3",
    "django-allauth[socialaccount]>=65.20.1",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", ".git", "__pycache__", "migrations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-v --tb=short -m 'not perf'"
markers = ["perf: 大规模性能测试；默认不运行，使用 `pytest -m perf` 单独执行"]
testpaths = ["apps", "config"]

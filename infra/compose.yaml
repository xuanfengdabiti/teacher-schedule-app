# ---------------------------------------------------------------------------
# 本地开发依赖：PostgreSQL 16 + Mailpit（邮件捕获）
# ---------------------------------------------------------------------------
# 启动：docker compose -f infra/compose.yaml up -d
# 停止：docker compose -f infra/compose.yaml down
# 销毁含数据：docker compose -f infra/compose.yaml down -v
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-schedule_dev}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-schedule_dev}"
      POSTGRES_DB: "${POSTGRES_DB:-schedule_dev}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schedule_dev} -d ${POSTGRES_DB:-schedule_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

volumes:
  pgdata:

name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: schedule_test
          POSTGRES_PASSWORD: schedule_test
          POSTGRES_DB: schedule_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      DJANGO_SECRET_KEY: "ci-secret-key-not-for-production"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgres://schedule_test:schedule_test@127.0.0.1:5432/schedule_test"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Django system check
        run: uv run python manage.py check

      - name: Check pending migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI contract
        run: uv run python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn

      - name: Run tests
        run: uv run pytest
